<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Financeira - SacraSub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            --text-color: #2d3748;
            --heading-color: #065f46;
            --border-color: #d1fae5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--primary-gradient);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .paper {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: var(--card-shadow);
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
        }

        h1 {
            color: var(--heading-color);
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #718096;
            font-size: 1.1rem;
            font-style: italic;
        }

        h2 {
            color: #047857;
            font-size: 1.5rem;
            margin-top: 40px;
            margin-bottom: 20px;
            border-left: 4px solid #10b981;
            padding-left: 15px;
        }

        h3 {
            color: #2d3748;
            font-size: 1.1rem;
            margin-top: 25px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        /* Table Styling */
        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background-color: #ecfdf5;
            color: #065f46;
            font-weight: 600;
            text-align: left;
            padding: 12px 15px;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* Progress Bar */
        .progress-container {
            background-color: #e2e8f0;
            border-radius: 99px;
            height: 20px;
            width: 100%;
            margin: 10px 0;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, #10b981 0%, #34d399 100%);
            height: 100%;
            border-radius: 99px;
            width: 0%;
            /* JS will fill this */
            transition: width 1s ease-in-out;
        }

        /* Buttons */
        .actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: transform 0.2s;
            text-decoration: none;
        }

        .btn-print {
            background-color: #059669;
            color: white;
        }

        .btn-print:hover {
            background-color: #047857;
            transform: translateY(-2px);
        }

        .btn-back {
            background-color: #f1f5f9;
            color: #475569;
        }

        .btn-back:hover {
            background-color: #e2e8f0;
        }

        @media print {
            body {
                background: white;
                color: black;
                padding: 0;
            }

            .container {
                max-width: 100%;
                margin: 0;
            }

            .paper {
                box-shadow: none;
                padding: 0;
            }

            .actions {
                display: none !important;
            }

            h2 {
                border-left-color: #000;
                color: #000;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="actions">
            <a href="index.html" class="btn btn-back">⬅️ Voltar ao Dashboard</a>
            <button class="btn btn-print" onclick="window.print()">🖨️ Imprimir Guia</button>
            <a href="https://docs.google.com/spreadsheets/d/1iVcDsHJ2pMiomzkWEjgyY6_5Tqb_nis_1Fh_2bbpx_4/edit" target="_blank" class="btn btn-print" style="background-color: #2f855a;">✏️ Editar Dados</a>
        </div>

        <div class="paper">
            <header>
                <h1>Gestão Financeira</h1>
                <p class="subtitle">Dados integrados com C6 Bank & Google Sheets</p>
                <p id="last-update" style="font-size: 0.8rem; color: #718096; margin-top: 5px;">Carregando dados...</p>
            </header>

            <!-- Filtros de Mês/Ano -->
            <div style="margin-bottom: 20px; text-align: center;">
                <select id="monthFilter" onchange="renderDashboard()" style="padding: 8px; border-radius: 5px; border: 1px solid #cbd5e1;">
                    <option value="all">Todo o Período</option>
                    <!-- Opções preenchidas via JS -->
                </select>
            </div>

            <!-- Resumo Financeiro Cards -->
            <div style="display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap;">
                <div style="flex: 1; min-width: 200px; padding: 20px; background: #ecfdf5; border-radius: 12px; border: 1px solid #a7f3d0;">
                    <h3 style="margin-top: 0; color: #047857;">Entradas</h3>
                    <p id="total-income" style="font-size: 1.5rem; font-weight: bold; color: #047857;">R$ 0,00</p>
                </div>
                <div style="flex: 1; min-width: 200px; padding: 20px; background: #fff1f2; border-radius: 12px; border: 1px solid #fecdd3;">
                    <h3 style="margin-top: 0; color: #be123c;">Saídas</h3>
                    <p id="total-expenses" style="font-size: 1.5rem; font-weight: bold; color: #be123c;">R$ 0,00</p>
                </div>
                <div style="flex: 1; min-width: 200px; padding: 20px; background: #eff6ff; border-radius: 12px; border: 1px solid #bfdbfe;">
                    <h3 style="margin-top: 0; color: #1e40af;">Saldo</h3>
                    <p id="total-balance" style="font-size: 1.5rem; font-weight: bold; color: #1e40af;">R$ 0,00</p>
                </div>
            </div>

            <h2>📊 Classificação de Despesas</h2>
            <div class="table-container">
                <table id="expenses-table">
                    <thead>
                        <tr>
                            <th>Categoria</th>
                            <th>Total Gasto</th>
                            <th>% do Total</th>
                        </tr>
                    </thead>
                    <tbody id="expenses-body">
                        <!-- Preenchido via JS -->
                    </tbody>
                </table>
            </div>

            <h2>📝 Últimas Transações</h2>
            <div class="table-container" style="max-height: 400px; overflow-y: auto;">
                <table id="transactions-table">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Descrição</th>
                            <th>Categoria</th>
                            <th>Valor</th>
                        </tr>
                    </thead>
                    <tbody id="transactions-body">
                        <!-- Preenchido via JS -->
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script>
        // ID da Planilha Google (Público/Published ou com chave de API, mas vamos usar gviz simples que exige "Publish to Web")
        // IMPORTANTE: O usuário precisa publicar a planilha na web (Arquivo > Compartilhar > Publicar na Web > CSV)
        // Ou deixar o link público para leitura.
        const SPREADSHEET_ID = '1iVcDsHJ2pMiomzkWEjgyY6_5Tqb_nis_1Fh_2bbpx_4';
        const SHEET_NAME = 'Financeiro 2026';

        let allTransactions = [];

        google.charts.load('current', { 'packages': ['corechart'] });
        google.charts.setOnLoadCallback(fetchData);

        function fetchData() {
            // Usando Google Visualization API Query Language
            const query = `SELECT A, B, C, D, E, F, G WHERE A IS NOT NULL OFFSET 1`; // Pula cabeçalho
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}&tq=${encodeURIComponent(query)}`;

            fetch(url)
                .then(res => res.text())
                .then(text => {
                    // O retorno vem como: /*O_o*/ google.visualization.Query.setResponse({...});
                    const jsonString = text.substring(47).slice(0, -2);
                    const json = JSON.parse(jsonString);
                    processData(json);
                })
                .catch(err => {
                    console.error('Erro ao buscar dados:', err);
                    document.getElementById('last-update').innerHTML = '❌ Erro ao carregar dados. <br>Verifique se a planilha está publicada na Web (Arquivo > Compartilhar > Publicar na Web).';
                });
        }

        function processData(json) {
            const rows = json.table.rows;
            allTransactions = rows.map(row => {
                // Colunas: 0=Data, 1=Desc, 2=Valor, 3=Tipo, 4=Categoria, 5=Mês, 6=Ano
                return {
                    date: row.c[0] ? row.c[0].f || row.c[0].v : '',
                    desc: row.c[1] ? row.c[1].v : '',
                    value: row.c[2] ? parseFloat(row.c[2].v) : 0,
                    type: row.c[3] ? row.c[3].v : '',
                    category: row.c[4] ? row.c[4].v : 'Outros',
                    month: row.c[5] ? row.c[5].v : '',
                    year: row.c[6] ? row.c[6].v : ''
                };
            });

            populateMonthFilter();
            renderDashboard();
            document.getElementById('last-update').innerText = `Atualizado em: ${new Date().toLocaleString()}`;
        }

        function populateMonthFilter() {
            const months = [...new Set(allTransactions.map(t => `${t.month}/${t.year}`))].filter(m => m !== '/').sort();
            const filter = document.getElementById('monthFilter');
            
            // Limpa opções antigas (mantém "Todo o Período")
            while (filter.options.length > 1) {
                filter.remove(1);
            }

            months.forEach(m => {
                const option = document.createElement('option');
                option.value = m;
                option.text = m;
                filter.add(option);
            });
            
            // Seleciona o mês atual se existir, senão o último
            // const currentMonth = new Date().toLocaleDateString('pt-BR', { month: '2-digit', year: 'numeric' });
            // if (months.includes(currentMonth)) filter.value = currentMonth;
        }

        function renderDashboard() {
            const selectedMonth = document.getElementById('monthFilter').value;
            
            const filteredData = selectedMonth === 'all' 
                ? allTransactions 
                : allTransactions.filter(t => `${t.month}/${t.year}` === selectedMonth);

            // Cálculos Totais
            const income = filteredData.filter(t => t.type === 'Receita').reduce((sum, t) => sum + t.value, 0);
            const expenses = filteredData.filter(t => t.type === 'Despesa').reduce((sum, t) => sum + t.value, 0);
            const balance = income - expenses; // Nota: Se Despesa for positivo, subtrai. Se for negativo no CSV, soma. 
                                               // O script python salva abs, e define tipo. Vamos assumir que valor é positivo no sheet.
            
            document.getElementById('total-income').innerText = income.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            document.getElementById('total-expenses').innerText = expenses.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            document.getElementById('total-balance').innerText = balance.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            document.getElementById('total-balance').style.color = balance >= 0 ? '#1e40af' : '#be123c';

            // Tabela de Despesas por Categoria
            const expensesByCategory = {};
            filteredData.filter(t => t.type === 'Despesa').forEach(t => {
                expensesByCategory[t.category] = (expensesByCategory[t.category] || 0) + t.value;
            });

            const sortedCategories = Object.entries(expensesByCategory).sort((a, b) => b[1] - a[1]);
            
            const expensesBody = document.getElementById('expenses-body');
            expensesBody.innerHTML = '';
            
            sortedCategories.forEach(([cat, val]) => {
                const percent = expenses > 0 ? (val / expenses) * 100 : 0;
                const row = `
                    <tr>
                        <td>${cat}</td>
                        <td>${val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</td>
                        <td>
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <div style="background: #e2e8f0; height: 8px; width: 100px; border-radius: 4px; overflow: hidden;">
                                    <div style="background: #10b981; height: 100%; width: ${percent}%;"></div>
                                </div>
                                ${percent.toFixed(1)}%
                            </div>
                        </td>
                    </tr>
                `;
                expensesBody.innerHTML += row;
            });

            // Tabela de Últimas Transações
            const transactionsBody = document.getElementById('transactions-body');
            transactionsBody.innerHTML = '';
            
            // Ordena por data (assumindo formato DD/MM/YYYY text, teria que converter, ou pega ordem original invertida se csv já vier ordenado)
            // Vamos apenas inverter para mostrar as últimas primeiro (se o CSV estiver cronológico)
            const recentTx = [...filteredData].reverse(); 

            recentTx.forEach(t => {
                const color = t.type === 'Receita' ? 'green' : 'red';
                const sign = t.type === 'Receita' ? '+' : '-';
                const row = `
                    <tr>
                        <td>${t.date}</td>
                        <td>${t.desc}</td>
                        <td><span style="font-size: 0.85em; background: #f1f5f9; padding: 2px 8px; border-radius: 12px;">${t.category}</span></td>
                        <td style="color: ${color}; font-weight: 500;">${sign} ${t.value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</td>
                    </tr>
                `;
                transactionsBody.innerHTML += row;
            });
        }
    </script>

</html>
